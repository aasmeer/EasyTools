<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unit Converter - EasyTools</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7faff;
        }

        .tool-page {
            min-height: 100vh;
            padding: 60px 20px 80px;
        }

        .tool-container {
            max-width: 900px;
            margin: auto;
        }

        .tool-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .tool-title h1 {
            font-size: 42px;
            margin: 15px 0 10px;
        }

        .tool-title p {
            color: #6b7280;
        }

        .badge {
            display: inline-block;
            padding: 7px 14px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 30px;
            font-size: 13px;
        }

        .converter-box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px #0000000b;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            background: white;
        }

        .field input:focus,
        .field select:focus {
            border-color: #2563eb;
        }

        .units-grid {
            display: grid;
            grid-template-columns: 1fr 60px 1fr;
            gap: 12px;
            align-items: end;
        }

        .swap-btn {
            height: 46px;
            border: none;
            border-radius: 9px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 20px;
            cursor: pointer;
        }

        .result-box {
            margin-top: 25px;
            padding: 24px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 14px;
            text-align: center;
        }

        .result-box span {
            display: block;
            color: #64748b;
            margin-bottom: 8px;
        }

        .result-box strong {
            font-size: 32px;
            color: #15803d;
        }

        @media(max-width:700px) {
            nav {
                display: none;
            }

            .units-grid {
                grid-template-columns: 1fr;
            }

            .swap-btn {
                width: 100%;
            }

            .tool-title h1 {
                font-size: 34px;
            }

            .converter-box {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="logo">⚙️ EasyTools</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="all-tools.html">All Tools</a>
        <a href="index.html#categories">Categories</a>
        <a href="index.html#pricing">Pricing</a>
    </nav>

    <div class="header-buttons">
        <button class="login-btn" onclick="comingSoon()">Login</button>
        <button class="signup-btn" onclick="comingSoon()">Sign Up</button>
    </div>

</header>

<main class="tool-page">

    <div class="tool-container">

        <div class="tool-title">

            <span class="badge">
                📏 Utility Tool
            </span>

            <h1>Unit Converter</h1>

            <p>
                Convert length, weight, temperature, speed and data units instantly.
            </p>

        </div>

        <div class="converter-box">

            <div class="field">

                <label for="category">
                    Category
                </label>

                <select id="category">
                    <option value="length">Length</option>
                    <option value="weight">Weight</option>
                    <option value="temperature">Temperature</option>
                    <option value="speed">Speed</option>
                    <option value="data">Data Size</option>
                </select>

            </div>

            <div class="field">

                <label for="inputValue">
                    Value
                </label>

                <input
                    type="number"
                    id="inputValue"
                    placeholder="Enter value"
                    value="1"
                >

            </div>

            <div class="units-grid">

                <div class="field">
                    <label for="fromUnit">From</label>
                    <select id="fromUnit"></select>
                </div>

                <button
                    class="swap-btn"
                    id="swapBtn"
                    type="button"
                >
                    ⇄
                </button>

                <div class="field">
                    <label for="toUnit">To</label>
                    <select id="toUnit"></select>
                </div>

            </div>

            <div class="result-box">

                <span>Converted Result</span>

                <strong id="resultValue">
                    0
                </strong>

            </div>

        </div>

    </div>

</main>

<script>
function comingSoon() {
    alert("This feature will be available soon.");
}
</script>

<script src="js/unit-converter.js"></script>

</body>

</html>
