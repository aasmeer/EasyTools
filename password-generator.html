<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator - EasyTools</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7faff;
        }

        .tool-page {
            min-height: 100vh;
            padding: 60px 20px 80px;
        }

        .tool-container {
            max-width: 850px;
            margin: auto;
        }

        .tool-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .tool-title h1 {
            font-size: 42px;
            margin: 15px 0 10px;
        }

        .tool-title p {
            color: #6b7280;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            padding: 7px 14px;
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 30px;
            font-size: 13px;
        }

        .generator-box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px #0000000b;
        }

        .password-output {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 25px;
        }

        .password-output input {
            flex: 1;
            min-width: 0;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 17px;
            font-family: monospace;
        }

        .copy-btn {
            padding: 15px 18px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .setting {
            margin-bottom: 22px;
        }

        .setting label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .setting input[type="range"] {
            width: 100%;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #f8fafc;
        }

        .option input {
            width: 18px;
            height: 18px;
        }

        .strength-box {
            margin-bottom: 22px;
            padding: 15px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
        }

        .strength-head {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .strength-bar {
            height: 10px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0;
            background: #94a3b8;
            transition: .2s;
        }

        .generate-btn {
            width: 100%;
            padding: 15px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .generate-btn:hover {
            background: #1d4ed8;
        }

        .note {
            margin-top: 20px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
        }

        @media(max-width:700px) {
            nav {
                display: none;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .password-output {
                flex-direction: column;
                align-items: stretch;
            }

            .tool-title h1 {
                font-size: 34px;
            }

            .generator-box {
                padding: 20px;
            }
        }
    </style>

</head>

<body>

<header class="header">

    <div class="logo">⚙️ EasyTools</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="all-tools.html">All Tools</a>
        <a href="index.html#categories">Categories</a>
        <a href="index.html#pricing">Pricing</a>
    </nav>

    <div class="header-buttons">
        <button class="login-btn" onclick="comingSoon()">Login</button>
        <button class="signup-btn" onclick="comingSoon()">Sign Up</button>
    </div>

</header>


<main class="tool-page">

    <div class="tool-container">

        <div class="tool-title">

            <span class="badge">
                🔐 Security Tool
            </span>

            <h1>Password Generator</h1>

            <p>
                Generate strong random passwords with custom length and character options.
            </p>

        </div>


        <div class="generator-box">

            <div class="password-output">

                <input
                    type="text"
                    id="passwordOutput"
                    readonly
                >

                <button
                    class="copy-btn"
                    id="copyBtn"
                    type="button"
                >
                    📋 Copy
                </button>

            </div>


            <div class="setting">

                <label for="lengthRange">
                    <span>Password Length</span>
                    <span id="lengthValue">16</span>
                </label>

                <input
                    type="range"
                    id="lengthRange"
                    min="6"
                    max="64"
                    value="16"
                >

            </div>


            <div class="options">

                <label class="option">
                    <input
                        type="checkbox"
                        id="uppercase"
                        checked
                    >
                    Uppercase (A-Z)
                </label>

                <label class="option">
                    <input
                        type="checkbox"
                        id="lowercase"
                        checked
                    >
                    Lowercase (a-z)
                </label>

                <label class="option">
                    <input
                        type="checkbox"
                        id="numbers"
                        checked
                    >
                    Numbers (0-9)
                </label>

                <label class="option">
                    <input
                        type="checkbox"
                        id="symbols"
                        checked
                    >
                    Symbols (!@#$)
                </label>

            </div>


            <div class="strength-box">

                <div class="strength-head">

                    <span>Password Strength</span>

                    <span id="strengthText">
                        -
                    </span>

                </div>

                <div class="strength-bar">

                    <div
                        class="strength-fill"
                        id="strengthFill"
                    ></div>

                </div>

            </div>


            <button
                class="generate-btn"
                id="generateBtn"
                type="button"
            >
                🔐 Generate Password
            </button>


            <div class="note">
                Passwords are generated locally in your browser.
                EasyTools does not need to send the generated password to a server.
            </div>

        </div>

    </div>

</main>


<script>
function comingSoon() {
    alert("This feature will be available soon.");
}
</script>

<script src="js/password-generator.js"></script>

</body>

</html>
